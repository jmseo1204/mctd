defaults:
  - dataset_generate_config

# ── [Group A: Dataset Loader] ─────────────────────────────────────────────
# Read directly by dataset.__init__() and env creation.
# Required at both train and eval time.
env_id: "cube-double-v0"
dataset: "cube-double-play-v0"
save_dir: ~/.ogbench/data
num_tasks: 5
# sample_length: frames per raw episode in the npz (auto-extracted at config generation time).
# episode_len = floor(int(sample_length * ratio) / snap_unit) * snap_unit
#   where snap_unit = jump * frame_stack (from ckpt_df_planning.yaml).
# Change sliding-window size via: dataset.extract_episode_ratio_from_sample=<ratio>
sample_length: 1001
episode_len: 1000  # ratio=1.0, snap_unit=50

# ── [Group B: Normalization Stats] ────────────────────────────────────────
# train time: interpolated into algorithm cfg via train_df_planning.yaml
#             (${dataset.observation_mean} etc.) and saved to ckpt training_hparams.
# eval time:  restored from ckpt training_hparams; yaml value is NOT used.
# Computed from cube-double-play-v0 training data
# (1001000 samples, obs_dim=37).
observation_mean: [-1.876236, -1.5570121, 2.0840704, -2.0900655, -1.5851139, -0.27539662, 0.00025541821, 0.0040930328, 0.0073185121, -0.0086308308, -3.120667e-05, 0.0032211759, -0.015351744, 0.01392094, 1.3061185, 0.23141682, 0.01051258, 0.94624561, 0.4437238, -0.011820399, 0.032356586, 0.48751184, 0.00077059702, 0.0036003443, -0.0021122273, 0.56095165, -0.014992191, -0.018650521, 0.0077702678, 0.0020454973, 0.48906416, 0.0072529069, 0.00076096412, 0.0014636646, 0.54651594, -0.0036767083, 5.55146e-05]
observation_std:  [0.36201358, 0.21564218, 0.2186354, 0.259359, 0.014288737, 1.7541, 0.34748238, 0.39233053, 0.39026603, 0.46689451, 0.0053667016, 0.54405701, 0.70397484, 1.5965415, 0.85157853, 0.63972682, 0.73275572, 0.76558799, 0.48797074, 0.73096186, 1.7035426, 0.66514838, 0.68188822, 0.16838826, 0.16442212, 0.40586832, 0.70246738, 0.71139598, 0.72355652, 1.7114409, 0.66632533, 0.6890707, 0.15107208, 0.15530422, 0.42350712, 0.71942776, 0.6945402]
# action_mean/std: empty → action_dim=0.
# The diffusion model generates observations only; actions are computed at
# runtime by DQL (antmaze) or PID (pointmaze) controller.
action_mean: []
action_std:  []
reward_mean: 0.000999001  # = n_terminals/n_samples (synthetic terminal reward)
reward_std:  0.0315912
