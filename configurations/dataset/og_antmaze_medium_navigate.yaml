defaults:
  - base_dataset

# ── [Group A: Dataset Loader] ─────────────────────────────────────────────
# Read directly by OGAntMazeOfflineRLDataset.__init__() and env creation.
# Required at both train and eval time.
env_id: "antmaze-medium-v0"
dataset: "antmaze-medium-navigate-v0"
save_dir: ~/.ogbench/data
episode_len: 500
num_tasks: 5

# ── [Group B: Normalization Stats] ────────────────────────────────────────
# train time: interpolated into algorithm cfg via train_df_planning.yaml
#             (${dataset.observation_mean} etc.) and saved to ckpt training_hparams.
# eval time:  restored from ckpt training_hparams; yaml value is NOT used.
# Computed from antmaze-medium-navigate-v0 training data
# (1001000 samples, obs_dim=29 = qpos[15] + qvel[14]).
observation_mean: [10.078878, 9.5191317, 0.52936995, 0.75863671, -0.017753255, -0.018526314, -0.40726277, 0.060879413, 0.76120055, -0.014173697, -0.7787506, 0.067728303, -0.69956845, -0.064467423, 0.69635808, -0.0024415047, -0.0041654054, -0.00091042352, 0.0055434364, -0.010781546, -0.0067219753, -0.0059983321, 0.0093232784, -0.004972144, -0.011981626, 0.00074481714, -0.0069249445, -0.0021365057, 0.017043553]
observation_std:  [6.2012181, 5.7342954, 0.11608699, 0.27852944, 0.2294445, 0.2256552, 0.27820513, 0.44119895, 0.28991124, 0.43238205, 0.27652341, 0.43347538, 0.26450396, 0.42631197, 0.25985631, 1.1006368, 1.0108632, 0.72105992, 1.1018753, 1.0398402, 1.0696344, 2.4043975, 2.0915182, 3.2300587, 1.8735839, 2.9462662, 1.7570604, 3.0343592, 1.5419885]
