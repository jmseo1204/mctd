jump: ${jump}  # inherited from root config

# ── [Group A: Dataset Loader] ─────────────────────────────────────────────
# Read directly by dataset.__init__() and env creation.
# Required at both train and eval time.
env_id: "antmaze-giant-v0"
dataset: "antmaze-giant-navigate-v0"
save_dir: ~/.ogbench/data
num_tasks: 5
# sample_length: frames per raw episode in the npz (auto-extracted at config generation time).
# episode_len = floor(int(sample_length * ratio) / snap_unit) * snap_unit
#   where snap_unit = jump * frame_stack (from ckpt_df_planning.yaml).
# Change sliding-window size via: algorithm.extract_episode_ratio_from_sample=<ratio>
sample_length: 2001
episode_len: 2000  # ratio=1.0, snap_unit=50

# ── [Group B: Normalization Stats] ────────────────────────────────────────
# train time: interpolated into algorithm cfg via train_df_planning.yaml
#             (${dataset.observation_mean} etc.) and saved to ckpt training_hparams.
# eval time:  restored from ckpt training_hparams; yaml value is NOT used.
# Computed from antmaze-giant-navigate-v0 training data
# (1000500 samples, obs_dim=29).
observation_mean: [24.522118, 17.191145, 0.49445, 0.657354, -0.034556687, -0.026426382, -0.3766177, 0.059313383, 0.78653109, -0.0073788781, -0.80935818, 0.01785866, -0.72502208, -0.055180363, 0.74040359, -0.011424438, -0.0034425592, -0.0008102468, 0.0030814072, -0.0092639225, -0.0012035774, -0.0059395223, 0.0053244745, -0.0033969597, -0.0083586881, -0.00028170607, -0.0041431128, -0.002269824, 0.013488526]
observation_std:  [14.897491, 11.685106, 0.14193469, 0.3489618, 0.34048274, 0.30857429, 0.30209199, 0.45351005, 0.30407962, 0.44501382, 0.28951034, 0.45038906, 0.28442472, 0.43618518, 0.28720334, 1.0670701, 0.98740876, 0.67643344, 1.0407348, 0.97409755, 1.0052, 2.2623062, 1.99068, 3.0596528, 1.7603551, 2.7991376, 1.6541384, 2.8724103, 1.4937603]
