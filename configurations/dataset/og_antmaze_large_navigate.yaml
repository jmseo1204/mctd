defaults:
  - base_dataset

# ── [Group A: Dataset Loader] ─────────────────────────────────────────────
# Read directly by OGAntMazeOfflineRLDataset.__init__() and env creation.
# Required at both train and eval time.
env_id: "antmaze-large-v0"
dataset: "antmaze-large-navigate-v0"
save_dir: ~/.ogbench/data
episode_len: 500
num_tasks: 5

# ── [Group B: Normalization Stats] ────────────────────────────────────────
# train time: interpolated into algorithm cfg via train_df_planning.yaml
#             (${dataset.observation_mean} etc.) and saved to ckpt training_hparams.
# eval time:  restored from ckpt training_hparams; yaml value is NOT used.
# Computed from antmaze-large-navigate-v0 training data
# (1001000 samples, obs_dim=29 = qpos[15] + qvel[14]).
observation_mean: [16.900721, 11.440328, 0.52307254, 0.7378723, -0.010466714, -0.023571512, -0.40364918, 0.062172454, 0.77236807, -0.0068733539, -0.77703708, 0.064524874, -0.6959694, -0.066280194, 0.70456278, -0.0068421443, 0.00072809862, -0.0014026947, 0.0034771143, -0.012927548, -0.0054552583, -0.0057171872, 0.0090712113, -0.0045851176, -0.012364162, 0.00068173755, -0.0060057575, -0.0023184882, 0.017119139]
observation_std:  [10.48876, 7.4409323, 0.12217693, 0.29012313, 0.24215834, 0.25732067, 0.28864583, 0.44402847, 0.29547256, 0.43502948, 0.27833319, 0.43828788, 0.26507559, 0.42631373, 0.26428175, 1.1406395, 1.0251092, 0.71696478, 1.0954081, 1.0266359, 1.0520388, 2.3643534, 2.0963182, 3.2212653, 1.8318983, 2.9373374, 1.743795, 3.0302472, 1.5809703]
# action_mean/std: empty → action_dim=0.
# The diffusion model generates observations only; actions are computed at
# runtime by DQL (antmaze) or PID (pointmaze) controller.
action_mean: []
action_std:  []
reward_mean: 0.000999001  # = n_terminals/n_samples (synthetic terminal reward)
reward_std:  0.0315912
