defaults:
  - base_dataset

# ── [Group A: Dataset Loader] ─────────────────────────────────────────────
# Read directly by OGAntMazeOfflineRLDataset.__init__() and env creation.
# Required at both train and eval time.
env_id: "antmaze-giant-v0"
dataset: "antmaze-giant-stitch-v0"
save_dir: ~/.ogbench/data
episode_len: 100
num_tasks: 5

# ── [Group B: Normalization Stats] ────────────────────────────────────────
# train time: interpolated into algorithm cfg via train_df_planning.yaml
#             (${dataset.observation_mean} etc.) and saved to ckpt training_hparams.
# eval time:  restored from ckpt training_hparams; yaml value is NOT used.
# Computed from antmaze-giant-stitch-v0 training data
# (1005000 samples, obs_dim=29 = qpos[15] + qvel[14]).
observation_mean: [25.898661, 17.793255, 0.56347823, 0.84719032, 0.0043805684, -0.010852066, -0.39495406, 0.056161135, 0.73499471, -0.011444925, -0.76304275, 0.099809557, -0.68779486, -0.064762905, 0.66377771, -0.015811829, -0.014537714, -0.008154925, 0.0071282201, -0.011880939, -0.039635208, -0.00045368256, 0.03250223, -0.0069437092, -0.037127089, 0.0017211052, -0.028658854, -0.0046451073, 0.037244968]
observation_std:  [16.847898, 11.938789, 0.089601077, 0.17353967, 0.12954322, 0.12273909, 0.25604782, 0.43109033, 0.27972403, 0.42115664, 0.2731342, 0.41856194, 0.25655556, 0.41782269, 0.2385734, 1.0866828, 0.99588692, 0.75331032, 1.1310842, 1.0819107, 1.0837947, 2.4714932, 2.1139188, 3.2636821, 1.9312187, 2.979394, 1.8493986, 3.0986769, 1.5921545]
