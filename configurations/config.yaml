# configuration parsing starts here
defaults:
  - experiment: exp_video # experiment yaml file name in configurations/experiments folder [fixme]
  - dataset: video_minecraft # dataset yaml file name in configurations/dataset folder [fixme]
  - algorithm: df_video # algorithm yaml file name in configurations/algorithm folder [fixme]
  - cluster: null # optional, cluster yaml file name in configurations/cluster folder. Leave null for local compute

debug: true # global debug flag will be passed into configuration of experiment, dataset and algorithm
jump: 1 # global jump flag will be passed into configuration of experiment, dataset and algorithm

wandb:
  group: algorithm.task_id # wandb group name
  entity: ${oc.env:WANDB_ENTITY,jmseo1204-seoul-national-university} # set via WANDB_ENTITY env var (see scripts/project_config.sh)
  project: ${oc.env:WANDB_PROJECT,mctd_eval} # set via WANDB_PROJECT env var (see scripts/project_config.sh)
  mode: online # set wandb logging to online, offline or dryrun
  shared_mode: false # if true, multiple benchmark processes attach to one shared WandB run
  shared_id: null # shared-mode run id used by both primary/worker processes
  shared_primary: true # shared-mode primary uploads config/files and owns finish state
  shared_label: null # shared-mode process label shown in WandB logs/system metrics
  shared_update_finish_state: true # worker should usually set this false
  job_type: null # optional WandB job_type for filtering/saved views

hostname: null # hostname to run the experiment on
gpu_id: null # gpu id to run the experiment on
resume: null # wandb run id to resume logging and loading checkpoint from
load: null # wanmdb run id containing checkpoint or a path to a checkpoint file

hydra:
  run:
    dir: ${oc.env:MCTD_OUTPUT_DIR,outputs}/${now:%Y-%m-%d}/${now:%H-%M-%S}
