defaults:
  - df_planning

# 15D qpos-only model (x,y,z,quat[4],joints[8])
# Token dim = 15 * frame_stack = 150 (vs 2D: 20, 29D: 290)
hilp_obs_dim: 15
dql_model: null
anchor_guidance_scale: 0.0
rdf_guidance_scale: 0.0

diffusion:
  clip_noise: 20.0
  stabilization_level: 10
  beta_schedule: linear
  objective: pred_x0
  use_snr_weighting: True
  snr_clip: 5.0
  ddim_sampling_eta: 0.1
  architecture:
    network_size: 128
    num_layers: 8
    attn_heads: 4
    dim_feedforward: 512
