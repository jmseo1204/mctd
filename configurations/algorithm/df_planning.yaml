defaults:
  - df_base

# dataset info
data_mean: null
data_std: null
reward_mean: ${dataset.reward_mean}
reward_std: ${dataset.reward_std}
observation_mean: ${dataset.observation_mean}
observation_std: ${dataset.observation_std}
action_mean: ${dataset.action_mean}
action_std: ${dataset.action_std}
gamma: ${dataset.gamma}
env_id: ${dataset.env_id}
dataset: ${dataset.dataset}
pos_dim: 2 # spatial x,y dims for MCTS guidance/visualization (always 2 for AntMaze/PointMaze)
# non dataset info
x_shape: null

context_frames: 1
use_reward: False
plot_start_goal: True
# training hyperparameters
weight_decay: 1e-4
warmup_steps: 10000
# diffusion-related
guidance_scale: 2.0
chunk_size: 50
interaction_seed: ${experiment.validation.seed}
use_random_goals_for_interaction: False
task_id: 1
dql_model: null
mctd_skip_level_steps: 10
time_limit: null
virtual_visit_weight: 1.0
warp_threshold: 1.0
parallel_multiple_visits: False

mctd_num_denoising_steps: 100 # Must be <= sampling_timesteps in df_base.yaml
leaf_parallelization: True
parallel_search_num: 8
mctd_max_search_num: 70
diverge_threshold: 4.0 # min endpoint distance to count as distinct path (below → deduplicate)
min_progress_threshold: 1.0 # min L2 distance (x,y) between sub_plan start and end; plans below this are discarded (0 = disabled)
plan_feasibility_delta: 100.0 # max per-frame movement (world units) to count a plan as feasible (set high to disable)
max_child_resets: 3 # max times a node's children can be wiped and re-expanded when all are exhausted non-terminal
particle_guidance_scale: 0.0 # sibling repulsion during denoising (0 = disabled)
padding_mode: "same" # "zero" or "same"
viz_plans: True
DEBUG: True
debug_memory_profile: True # Enable GPU/CPU memory profiling
profiler_snapshot_frames: 20 # Number of denoising frames to keep for video visualization
frame_sampling_way: "quadratic" # 'linear': evenly-strided; 'quadratic': dense near end-of-denoising
meeting_delta: 1.5
horizon_scale: 0.3 # horizon = episode_len * horizon_scale
sequence_dividing_factor: 3
noise_level_building_way: pyramid
num_tries_for_bad_plans: 3
open_loop_horizon: 380 #fixme -> best: episode_len*horizon_scale
val_max_loops: 16 # fixme -> best: 2(bidirectional)*sequence_dividing_factor*open_loop_horizon
sub_goal_interval: 1

# HILP value function guidance
# For .pkl checkpoints (JAX/Flax): all hyper-params are auto-detected from the file.
#   Aggregator (inner_prod vs neg_l2) is read from a sidecar JSON:
#     td_models/<same-stem>.json  →  {"aggregator": "inner_prod"}
#   If no sidecar exists, inner_prod is used (matches training default).
# For legacy .pt checkpoints: hilp_obs_dim / hilp_skill_dim are still needed.
hilp_checkpoint_path: "td_models/params_1000000_20260324_002241.pkl"
mctd_guidance_scales: [0.4] # HILP gradient scale for near-target positions (TD_thres or above)
rmse_guidance_scale: 0.4 # RMSE direction scale for far-target positions (below TD_thres)
anchor_guidance_scale: 0.4 # 0.4
rdf_guidance_scale: 0.0
# HILP guidance mode flags
use_score_func_with_TD: true # if true: HILP grad + KDE score grad; if false: HILP grad only
TD_thres_for_far_target: 0.0 # HILP value threshold: V < threshold → use RMSE guidance; null to disable
# KDE-weighted guidance: unit_grad = ∇V/|∇V| + kde_lam·∇log p

# [Kernal Density Estimation for extracting score function of training data]
kde_sigma: 0.2 # KDE bandwidth (world units)
kde_lam: 0.05 # scale for ∇log p term
kde_sample_ratio: 0.1 # fraction of dataset to use for KDE (1.0 = full dataset)
kde_save_dir: ${dataset.save_dir} # dataset npz directory for KDE positions

# [DEPRECATED]
mcts_use_sim: false # always false. true version is deprecated
use_rollout: false # always false. true version is deprecated
use_dynamic_obs_padding: false # always false. true version is deprecated

diffusion:
  clip_noise: 20.0
  max_guidance_ratio: 1.5 # soft norm clip: guidance/prior norm 상한 (inf = disabled)
  stabilization_level: 10
  beta_schedule: linear
  objective: pred_x0
  use_snr_weighting: True
  snr_clip: 5.0
  ddim_sampling_eta: 0.1
