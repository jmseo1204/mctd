defaults:
  - df_base

# dataset info
data_mean: null
data_std: null
reward_mean: ${dataset.reward_mean}
reward_std: ${dataset.reward_std}
observation_mean: ${dataset.observation_mean}
observation_std: ${dataset.observation_std}
action_mean: ${dataset.action_mean}
action_std: ${dataset.action_std}
gamma: ${dataset.gamma}
env_id: ${dataset.env_id}
dataset: ${dataset.dataset}
# non dataset info
x_shape: null
frame_stack: 10
context_frames: 1
use_reward: False
causal: False
plot_start_goal: True
# training hyperparameters
weight_decay: 1e-4
warmup_steps: 10000
# diffusion-related
guidance_scale: 2.0
chunk_size: 50
interaction_seed: ${experiment.validation.seed}
use_random_goals_for_interaction: False
task_id: 1
dql_model: null
mctd_skip_level_steps: 10
time_limit: null
virtual_visit_weight: 1.0
warp_threshold: 1.0
leaf_parallelization: False
parallel_multiple_visits: False

mctd_num_denoising_steps: 100 # Must be <= sampling_timesteps in df_base.yaml
parallel_search_num: 1
mctd_max_search_num: 70
mctd_guidance_scales: [10.0]
padding_mode: "same" # "zero" or "same"
viz_plans: True
DEBUG: True
debug_log_level: 2 # 0=off, 1=basic (allocations), 2=detailed (memory tracking), 3=verbose (every step)
debug_log_interval: 10 # Log every N MCTS iterations
debug_memory_profile: True # Enable GPU/CPU memory profiling
max_plan_hist_keep: 1 # Keep only last N plan histories (memory optimization)
meeting_delta: 2.0
episode_len: ${dataset.episode_len} # self.n_tokens = self.episode_len // self.frame_stack
horizon_scale: 0.3 # horizon = self.episode_len * horizon_scale
sequence_dividing_factor: 3
num_tries_for_bad_plans: 3
open_loop_horizon: 300 #fixme -> best: episode_len*horizon_scale
val_max_loops: 8 # fixme -> best: 2(bidirectional)*sequence_dividing_factor*open_loop_horizon
sub_goal_interval: 5
scheduling_matrix: smooth

# HILP value function guidance
hilp_checkpoint_path: "td_models/hilp_ckpt_latest.pt"
hilp_obs_dim: 29  # AntMaze observation dimension
hilp_skill_dim: 32  # HILP phi representation dimension
anchor_guidance_scale: 0.0 # 40.0
rdf_guidance_scale: 0.0 # 2.0
mcts_use_sim: false
use_rollout: false  # If false, skip _rollout_leaf_plan; derive obs_pos from plan_history instead of physical sim
use_dynamic_obs_padding: false  # If true, use parent_node's obs_pos as padding; if false, always use root_node's obs_pos

diffusion:
  clip_noise: 20.0
  stabilization_level: 10
  beta_schedule: linear
  objective: pred_x0
  use_snr_weighting: True
  snr_clip: 5.0
  ddim_sampling_eta: 0.1
  architecture:
    network_size: 256
    num_layers: 12
    attn_heads: 8
    dim_feedforward: 1024
