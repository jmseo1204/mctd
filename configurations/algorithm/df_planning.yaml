# ─────────────────────────────────────────────────────────────────────────────
# Eval-only config: fully self-contained (no defaults chain).
# Edit this file before running eval.sh.
# Train config → train_df_planning.yaml (separate, no cross-dependency).
# ─────────────────────────────────────────────────────────────────────────────

# ── Planning / interaction ────────────────────────────────────────────────────
use_reward: False
plot_start_goal: True
interaction_seed: 1
use_random_goals_for_interaction: False
task_id: 1
eval_repeat_id: null
benchmark_num_rollouts: 1
benchmark_rollout_seed_base: 0
benchmark_results_path: null
benchmark_model_id: null
dql_model: null
mctd_skip_level_steps: 10
time_limit: null
virtual_visit_weight: 1.0
parallel_multiple_visits: False
leaf_parallelization: True
mctd_max_search_num: 20
max_child_resets: 1
DEBUG: True
debug_memory_profile: True
noise_level_building_way: others # smooth, causal, or others
num_tries_for_bad_plans: 1
open_loop_horizon: 1300 #fixme -> best: int(eval_episode_len * horizon_scale) // jump
val_max_loops: 16 # fixme -> best: 2(bidirectional)*sequence_dividing_factor*open_loop_horizon
sub_goal_interval: 1
sub_goal_blend_steps: 0 # steps to blend old/new sub_goal actions after a sub_goal switch (antmaze only)
sequence_dividing_factor: 8
parallel_search_node: 3 # parallel_search_num = parallel_search_node * len(mctd_guidance_scales)
segment_episode_len: 200 # raw episode length per segment (pre-jump); effective = segment_episode_len * sequence_dividing_factor; n_tokens = (effective // jump) // frame_stack + 1

# HILP value function guidance
# For .pkl checkpoints (JAX/Flax): all hyper-params are auto-detected from the file.
#   Aggregator (inner_prod vs neg_l2) is read from a sidecar JSON:
#     td_models/<same-stem>.json  →  {"aggregator": "inner_prod"}
#   If no sidecar exists, inner_prod is used (matches training default).
# For legacy .pt checkpoints: hilp_obs_dim / hilp_skill_dim are still needed.
hilp_checkpoint_path: "td_models/params_1000000_20260324_002241.pkl"
mctd_guidance_scales: [0.8, 0.4, 0.0] # HILP gradient scale for near-target positions (TD_thres or above)
rmse_guidance_scale: 0.2 # RMSE direction scale for far-target positions (below TD_thres)
anchor_guidance_scale_ratio: 1.2
rdf_guidance_scale: 2.0
rdf_sigma: 0.7 # bandwidth for segment_rdf_guidance; at d=sigma the gradient magnitude equals rdf_guidance_scale
particle_guidance_scale: 0.0 # sibling repulsion during denoising (0 = disabled)
use_directly_inject_guidance_to_x0: true # if true: apply guidance in clean x0 space instead of DPS-style xt space
direct_x0_guidance_scale: 0.2 # κ in η_t = κ * sqrt((1-α_t)/α_t) for direct x0 guidance
direct_x0_eta_cap: 1.0 # hard cap on η_t (null = no cap). At t=T, η_t≈6.3; set 1.0 to prevent high-noise guidance explosion

# [state proximity threshold]
use_TD_metric_as_dist: true # If true, use HILP temporal distance (-V(s,g)) instead of L2(x,y)
warp_threshold: 3.0
diverge_threshold: 4.0 # min endpoint distance to count as distinct path (below → deduplicate)
min_progress_threshold: 4.0 # min distance (x,y) between sub_plan start and end
plan_feasibility_delta: 99999.0 # max per-frame movement (world units) to count a plan as feasible
thres_min_dist_to_prior_plan: 4.0 # min distance between the current subplan tail and any prior-plan frame before prefix_len
meeting_delta: 1.2

# [wandb visualization]
viz_agent_rollout: false # set True to upload *_interaction/sample_*_video to wandb (slow)
viz_final_plans: false
viz_compare_expanded_to_value: false
viz_mujoco_renderer: false
viz_subplan_denoising: false # set True to upload plan/plan_at_* to wandb (slow)
viz_replanning: false # set True to also log replanned stage denoising video (requires mcts_use_replan)
viz_uncertain_next_subplan_last_obs: false
profiler_snapshot_frames: 20 # Number of denoising frames to keep for video visualization
frame_sampling_way: "linear" # 'linear': evenly-strided; 'quadratic': dense near end-of-denoising

# HILP memoization: precompute phi(s) on a 2D grid and use bilinear interpolation
use_hilp_memoization: true # set true to enable
hilp_memoization_grid_size: 360 # grid resolution per axis

# HILP guidance mode flags
use_score_func_with_TD: true # if true: HILP grad + KDE score grad; if false: HILP grad only
TD_thres_for_far_target: -200.0 # HILP value threshold: V < threshold → use RMSE guidance
# KDE-weighted guidance: unit_grad = ∇V/|∇V| + kde_lam·∇log p
kde_sigma: 0.1 # KDE bandwidth (world units)
kde_grad_thres_sigma_coeff: 0.3 # threshold = mean + coeff * std for KDE gradient filtering
kde_lam: 0.0 # scale for ∇log p term
regularize_goal_guidance: true # if true: re-normalize (unit_hilp + kde_lam·kde_score) to unit vector before applying guidance_scale
kde_sample_ratio: 0.1 # fraction of dataset to use for KDE (1.0 = full dataset)
kde_save_dir: "~/.ogbench/data" # dataset npz directory for KDE positions

# REPLANNING
mcts_use_replan: false
replanning_target_level: 25 # 11 for linear, noise level to add when replanning already-denoised prefix

# UNCERTAINTY CHECK
use_uncertainty_as_value: true
uncertainty_mode: 'cluster' # 'entropy' | 'variance' | 'cluster'
uncertainty_lambda: 1.0 # entropy: weight on angular entropy surrogate; variance: weight on V_ext_g
uncertainty_eta: 1.0 # entropy: weight on geometry correction; variance: weight on V_ext_c
fast_sampling_multiple: 3 # number of fast samples per candidate
fast_sampling_steps: 25 # denoising steps for fast uncertainty sampling (< sampling_timesteps)
uncertainty_max_intra_cluster_dist: 30.0 # max temporal distance (steps) within a cluster for complete-linkage cut
use_cluster_subplan_as_expansion: true # if true: reuse per-cluster subplans from uncertainty sampling as child expansions

# [MPC-style agent control]
agent_action_scale: 0.7 # scale factor for DQL agent action torque (antmaze only); reduces flipping
use_rollout: false
use_dynamic_obs_padding: false
use_segment_wise_sliding_window: true
use_sliding_window_clip_x_start: true # if true: clamp window tokens to ±clip_x_start sigma after each window DDIM step (prevents guidance explosion in sliding window mode)

# ── Inherited from root config ────────────────────────────────────────────────
debug: ${debug}
jump: null # schema stub: restored from ckpt training_hparams via _apply_ckpt_hparams_to_cfg

# ── Dataset info ─────────────────────────────────────────────────────────────
# null at eval time; filled from ckpt training_hparams before model build.
# At train time, train_df_planning.yaml overrides these with ${dataset.xxx}.
data_mean: null
data_std: null
reward_mean: null
reward_std: null
observation_mean: null
observation_std: null
action_mean: null
action_std: null
env_id: null
dataset: null
# x_shape: computed at runtime from obs_dim + action_dim in DiffusionForcingPlanning.__init__
x_shape: null

# ── Schema stubs: restored from ckpt training_hparams at eval time ───────────
# All values here are null — actual values are overwritten by _apply_ckpt_hparams_to_cfg()
# before the model is built. Keys must exist for OmegaConf.update() to succeed.
obs_dim_indices: null
pos_dim_indices: null
frame_stack: null
frame_skip: null
causal: null
scheduling_matrix: null
context_frames: null
padding_mode: null
dataset_config: null

# ── Model build params: restored from ckpt training_hparams ─────────────────
external_cond_dim: null
uncertainty_scale: null

# ── Diffusion ─────────────────────────────────────────────────────────────────
diffusion:
  # Eval-specific diffusion params
  ddim_sampling_eta: 0.1 # used during MCTS DDIM sampling; absent in train config
  max_guidance_ratio: 1.5 # soft norm clip for guidance (inf = disabled); eval only
  # sampling_timesteps: eval-time DDIM steps; NOT restored from ckpt.
  # Controls both denoising granularity and step count (must satisfy: sampling_timesteps <= timesteps).
  # For fast uncertainty sampling, use fast_sampling_steps < sampling_timesteps.
  sampling_timesteps: 100
  sampling_way: "huber" # 'linear': uniform stride; 'quadratic': dense near x_0; 'huber': quadratic below delta, linear above
  sampling_huber_delta: 0.3 # t-space threshold for huber mode (0~1); larger = wider quadratic region (more dense near x_0)
  # Schema stubs restored from ckpt training_hparams (actual values come from ckpt)
  timesteps: null
  beta_schedule: null
  objective: null
  architecture:
    network_size: null
    num_layers: null
    attn_heads: null
    dim_feedforward: null
  # Schema stubs: restored from ckpt training_hparams (actual values come from ckpt)
  # cum_snr_decay: on_save_checkpoint saves the PRE-modification value so __init__
  #   can apply frame_stack power exactly once, as during training.
  schedule_fn_kwargs: null
  use_fused_snr: null
  snr_clip: null
  cum_snr_decay: null
  clip_noise: null
  clip_x_start: 2.0  # clamp guided x_start to ±N sigma (normalized); antmaze-giant map x/y range is ±1.54σ from mean
                     # (x∈[0,52] → normalized ±1.54σ). Set 2.0 for map-safe clipping (covers map + small margin).
                     # 5.0 is too loose (allows world coords up to ±110, well outside map).
                     # Only active when use_sliding_window_clip_x_start: true.
  stabilization_level: null
