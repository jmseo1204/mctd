# ─────────────────────────────────────────────────────────────────────────────
# Training-only config: optimizer, data loading, and dataset stats.
# Composes with ckpt_df_planning.yaml (model definition) via Hydra defaults.
# Edit ckpt_df_planning.yaml to change the model architecture or training data.
# ─────────────────────────────────────────────────────────────────────────────

defaults:
  - ckpt_df_planning

# ── Inherited from root config ────────────────────────────────────────────────
debug: ${debug}
lr: 2e-4

# ── Dataset stats (overrides nulls; filled from ${dataset.xxx} at train time) ─
reward_mean: ${dataset.reward_mean}
reward_std: ${dataset.reward_std}
observation_mean: ${dataset.observation_mean}
observation_std: ${dataset.observation_std}
action_mean: ${dataset.action_mean}
action_std: ${dataset.action_std}
env_id: ${dataset.env_id}
dataset: ${dataset.dataset}
x_shape: null # computed at runtime in DiffusionForcingPlanning.__init__
data_mean: ${dataset.data_mean}
data_std: ${dataset.data_std}

# ── Optimizer ────────────────────────────────────────────────────────────────
weight_decay: 1e-4
lr_min_ratio: 0.1
optimizer_beta: [0.9, 0.999]
warmup_steps: 10000 # overrides df_base default (2000)
noise_level: random_all

# ── Visualization (read by train.sh; used every 10k steps in training_step) ──
# valid_episode_len = episode_len * valid_episode_len_multiple tokens are generated
# via DDIM and logged to training_visualization/sample_* in WandB.
valid_episode_len_multiple: 1.0
episode_len: ${dataset.episode_len}

# ── Training loop (read by train.sh → passed as experiment.* CLI overrides) ──
# Edit these to change training behavior without touching train.sh.
training_loop:
  batch_size: 2048
  max_steps: 600015
  checkpointing_every_n_steps: 4000
  validation_precision: 32
  validation_inference_mode: false
  validation_val_every_n_step: null # null = use val_every_n_epoch instead
  validation_val_every_n_epoch: 5000
